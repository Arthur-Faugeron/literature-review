<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{PAPER_TITLE}} — Literature Review Template — Macro-Finance Series</title>
<style>
/* ==========================================================================
   LITERATURE REVIEW — MACRO-FINANCE SERIES TEMPLATE
   Style: Old Money + Institutional Research + European Financial Journal
          + Traditional Investment Banking
   This file is the reference template for every report filed under
   Literature Review / SERIES / Macro-Finance /. Copy the <style> block and
   the page structure below when preparing a new report in this series.
   ========================================================================== */

@page {
  size: A4;
  margin: 26mm 20mm 22mm 20mm;
  background: #F5F1E8;
  @bottom-center {
    content: counter(page);
    font-family: 'Liberation Sans', sans-serif;
    font-size: 8.5pt;
    color: #6B5744;
  }
}

:root {
  --ivory: #F5F1E8;
  --navy: #172A3A;
  --tweed: #6B5744;
  --olive: #3F4A32;
  --camel: #C8AE82;
}

* { box-sizing: border-box; }

body {
  background: var(--ivory);
  color: var(--navy);
  font-family: 'Liberation Serif', 'Times New Roman', serif;
  font-size: 10.6pt;
  line-height: 1.5;
  margin: 0;
  padding: 0;
}

/* ---------- Front page ---------- */
.frontpage {
  page-break-after: always;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding-top: 18mm;
}

.frontpage .kicker {
  font-family: 'Liberation Sans', sans-serif;
  font-size: 8.5pt;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--tweed);
  border-top: 1pt solid var(--navy);
  border-bottom: 0.5pt solid var(--camel);
  padding: 3mm 0;
}

.frontpage h1.title {
  font-family: 'Liberation Serif', serif;
  font-weight: 700;
  font-size: 24pt;
  line-height: 1.25;
  color: var(--navy);
  margin: 14mm 0 6mm 0;
}

.frontpage .authors {
  font-size: 12pt;
  color: var(--olive);
  margin-bottom: 2mm;
}

.frontpage .meta-table {
  margin-top: 10mm;
  border-top: 0.75pt solid var(--navy);
  padding-top: 4mm;
  width: 100%;
  border-collapse: collapse;
  font-size: 9.5pt;
}
.frontpage .meta-table td { padding: 1.6mm 0; vertical-align: top; }
.frontpage .meta-table td.label {
  width: 38mm;
  font-family: 'Liberation Sans', sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-size: 8pt;
  color: var(--tweed);
}

.frontpage .abstract-block {
  margin-top: 10mm;
  border-top: 0.5pt solid var(--camel);
  padding-top: 5mm;
}
.frontpage .abstract-block .label {
  font-family: 'Liberation Sans', sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-size: 8.5pt;
  color: var(--tweed);
  margin-bottom: 2mm;
}
.frontpage .abstract-block p { font-size: 10pt; text-align: justify; }

.frontpage .imprint {
  font-family: 'Liberation Sans', sans-serif;
  font-size: 8pt;
  color: var(--tweed);
  border-top: 0.5pt solid var(--camel);
  padding-top: 3mm;
}

/* ---------- Body typography ---------- */
h2.section {
  font-family: 'Liberation Serif', serif;
  font-weight: 700;
  font-size: 15pt;
  color: var(--navy);
  border-bottom: 1pt solid var(--navy);
  padding-bottom: 2mm;
  margin-top: 12mm;
  margin-bottom: 5mm;
}

h3.subsection {
  font-family: 'Liberation Serif', serif;
  font-weight: 700;
  font-size: 12pt;
  color: var(--olive);
  margin-top: 7mm;
  margin-bottom: 3mm;
}

h4.minor {
  font-family: 'Liberation Serif', serif;
  font-style: italic;
  font-weight: 700;
  font-size: 10.6pt;
  color: var(--tweed);
  margin-top: 5mm;
  margin-bottom: 2mm;
}

p { text-align: justify; margin: 0 0 3mm 0; }

.lede {
  font-size: 11.5pt;
  color: var(--olive);
  border-left: 2pt solid var(--camel);
  padding-left: 4mm;
  margin: 4mm 0 6mm 0;
}

/* ---------- Tables: traditional, restrained, no rounded corners ---------- */
table.data {
  width: 100%;
  border-collapse: collapse;
  margin: 4mm 0 6mm 0;
  font-family: 'Liberation Sans', sans-serif;
  font-size: 8.8pt;
}
table.data caption {
  text-align: left;
  font-family: 'Liberation Serif', serif;
  font-weight: 700;
  font-style: italic;
  color: var(--navy);
  font-size: 9.6pt;
  margin-bottom: 2mm;
  caption-side: top;
}
table.data thead tr { border-top: 1pt solid var(--navy); border-bottom: 0.75pt solid var(--navy); }
table.data th {
  text-align: left;
  padding: 2mm 2.5mm;
  font-weight: 700;
  color: var(--navy);
}
table.data td {
  padding: 1.8mm 2.5mm;
  border-bottom: 0.4pt solid #D8CDB4;
  color: var(--navy);
}
table.data tbody tr:nth-child(odd) { background: rgba(200,174,130,0.10); }
table.data tfoot td {
  border-top: 0.75pt solid var(--navy);
  font-size: 8pt;
  color: var(--tweed);
  padding-top: 2mm;
}

/* ---------- Equation blocks ---------- */
.equation {
  text-align: center;
  margin: 5mm 0;
  font-size: 11.5pt;
  color: var(--navy);
}
.eq-number { float: right; color: var(--tweed); font-size: 9pt; }

/* ---------- Callout boxes for PAPER / EVIDENCE / CRITIQUE / INFERENCE / EXTENSION ---------- */
.tag {
  display: inline-block;
  font-family: 'Liberation Sans', sans-serif;
  font-size: 7.6pt;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ivory);
  background: var(--navy);
  padding: 0.6mm 2mm;
  margin-right: 2mm;
}
.tag.evidence { background: var(--olive); }
.tag.critique { background: var(--tweed); }
.tag.inference { background: #8A7350; }
.tag.extension { background: #4C5B45; }

/* ---------- Figures ---------- */
.figure { margin: 5mm 0 6mm 0; text-align: center; }
.figure img { width: 100%; border: 0.5pt solid var(--camel); }
.figure .caption {
  font-family: 'Liberation Sans', sans-serif;
  font-size: 8pt;
  color: var(--tweed);
  text-align: left;
  margin-top: 2mm;
}

/* ---------- Research idea cards ---------- */
.idea {
  border-top: 0.75pt solid var(--camel);
  padding-top: 3mm;
  margin-top: 5mm;
}
.idea .idea-title { font-weight: 700; color: var(--navy); font-size: 11pt; }
.idea .idea-field { font-family: 'Liberation Sans', sans-serif; font-size: 8pt; color: var(--tweed); text-transform: uppercase; letter-spacing: 0.06em; }

/* ---------- Final synthesis box ---------- */
.synthesis {
  border: 0.75pt solid var(--navy);
  padding: 5mm 6mm;
  margin-top: 6mm;
  background: rgba(200,174,130,0.08);
}
.synthesis h4 { margin-top: 0; }

/* ---------- References ---------- */
.references p {
  text-indent: -8mm;
  margin-left: 8mm;
  font-size: 9.4pt;
  text-align: left;
}
</style>
</head>
